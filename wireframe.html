<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>NutriMente · Wireframe MVP</title>
    <style>
        /* ---------- MODERN MINIMAL WIREFRAME - MOBILE FIRST, PERFECT SPACING ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #e8e8e8;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #111111;
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobile frame - exactly like a phone viewport */
        .mobile-frame {
            width: 100%;
            max-width: 390px;
            height: 100vh;
            max-height: 844px;
            background: #ffffff;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.08), 0 20px 35px -12px rgba(0,0,0,0.2);
            border-radius: 0;
        }

        /* custom scroll inside mobile frame */
        .mobile-frame::-webkit-scrollbar {
            width: 3px;
        }
        .mobile-frame::-webkit-scrollbar-track {
            background: #f0f0f0;
        }
        .mobile-frame::-webkit-scrollbar-thumb {
            background: #bbb;
            border-radius: 10px;
        }

        /* Consistent spacing system - 16px base grid */
        .screen-content {
            padding: 24px 20px 32px 20px;
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Typography - clean */
        h1, h2, h3 {
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .hero-title {
            font-size: 3rem;
            line-height: 1.05;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .text-body {
            font-size: 0.9375rem;
            line-height: 1.45;
            color: #2c2c2c;
        }

        .text-caption {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 500;
            color: #767676;
        }

        .text-small {
            font-size: 0.75rem;
            color: #6b6b6b;
        }

        /* Buttons - properly padded and spaced */
        .btn {
            background: transparent;
            border: 1px solid #1a1a1a;
            padding: 14px 20px;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
            color: #000;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 60px;
            width: 100%;
        }

        .btn:active {
            background: #f5f5f5;
            transform: scale(0.98);
        }

        .btn-secondary {
            border-color: #d0d0d0;
            background: white;
        }

        .btn-small {
            padding: 10px 16px;
            font-size: 0.8125rem;
            width: auto;
        }

        .btn-outline-danger {
            border-color: #dc2626;
            color: #dc2626;
        }

        /* Button groups with proper gaps */
        .button-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }

        .button-group-horizontal {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Grid layouts */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        /* Cards & containers */
        .card {
            border: 1px solid #ececec;
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
        }

        .card-highlight {
            background: #fafafa;
            border-color: #e5e5e5;
        }

        .divider {
            height: 1px;
            background: #efefef;
            width: 100%;
            margin: 16px 0;
        }

        /* List items */
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        /* Form elements */
        .input-group {
            margin-bottom: 20px;
        }

        label {
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #6b6b6b;
            margin-bottom: 8px;
            display: block;
        }

        input, textarea {
            width: 100%;
            border: 1px solid #e2e2e2;
            background: #ffffff;
            padding: 14px 16px;
            font-size: 0.9375rem;
            font-family: inherit;
            border-radius: 16px;
            transition: border 0.15s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #1a1a1a;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        /* Bottom Navigation - fixed inside mobile frame */
        .bottom-nav {
            position: sticky;
            bottom: 0;
            background: #ffffff;
            border-top: 1px solid #ececec;
            padding: 8px 12px 12px;
            margin-top: auto;
        }

        .nav-items {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 4px;
        }

        .nav-item {
            background: none;
            border: none;
            padding: 10px 0 6px;
            font-size: 0.68rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            cursor: pointer;
            color: #9a9a9a;
            font-family: inherit;
            flex: 1;
            text-align: center;
            border-radius: 30px;
            transition: all 0.1s;
        }

        .nav-item.active {
            color: #000000;
            font-weight: 600;
            background: #f2f2f2;
        }

        .nav-item:active {
            background: #e8e8e8;
        }

        /* Progress indicator */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .progress-bar-bg {
            flex: 1;
            height: 2px;
            background: #eaeaea;
            border-radius: 2px;
        }
        .progress-fill {
            height: 100%;
            background: #1a1a1a;
            border-radius: 2px;
            width: 0%;
        }

        /* Modal overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 200;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-content {
            background: white;
            width: 100%;
            max-width: 390px;
            border-radius: 28px 28px 0 0;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px 20px 32px;
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        /* Spacing utilities */
        .mt-1 { margin-top: 4px; }
        .mt-2 { margin-top: 8px; }
        .mt-3 { margin-top: 12px; }
        .mt-4 { margin-top: 16px; }
        .mt-5 { margin-top: 20px; }
        .mt-6 { margin-top: 24px; }
        .mt-8 { margin-top: 32px; }
        .mb-1 { margin-bottom: 4px; }
        .mb-2 { margin-bottom: 8px; }
        .mb-3 { margin-bottom: 12px; }
        .mb-4 { margin-bottom: 16px; }
        .mb-5 { margin-bottom: 20px; }
        .mb-6 { margin-bottom: 24px; }
        .mb-8 { margin-bottom: 32px; }
        .gap-2 { gap: 8px; }
        .gap-3 { gap: 12px; }
        .gap-4 { gap: 16px; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .w-full { width: 100%; }
        .text-center { text-align: center; }
        .text-left { text-align: left; }
        .border-bottom { border-bottom: 1px solid #efefef; }
        .rounded-full { border-radius: 999px; }
        .cursor-pointer { cursor: pointer; }
        .italic { font-style: italic; }
        .avatar { width: 56px; height: 56px; border-radius: 60px; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; font-size: 24px; background: white; }
        .avatar-large { width: 96px; height: 96px; font-size: 40px; margin: 0 auto; }
        .inline-icon { font-size: 18px; }
    </style>
</head>
<body>
<div id="root" class="mobile-frame"></div>

<script>
    // ---------- APP STATE ----------
    let currentPage = 'landing';
    let diagnosisStep = 0;
    let selectedArticle = null;

    // Helper to render full UI
    function render() {
        const root = document.getElementById('root');
        if (!root) return;

        const hideNavPages = ['landing', 'auth', 'diagnosis', 'checkin', 'meal-log', 'reflection'];
        const showBottomNav = !hideNavPages.includes(currentPage) && !selectedArticle;

        let pageContent = '';
        switch (currentPage) {
            case 'landing': pageContent = LandingPage(); break;
            case 'auth': pageContent = AuthPage(); break;
            case 'diagnosis': pageContent = DiagnosisPage(); break;
            case 'dashboard': pageContent = DashboardPage(); break;
            case 'checkin': pageContent = CheckinPage(); break;
            case 'meal-log': pageContent = MealLogPage(); break;
            case 'content': pageContent = ContentPage(); break;
            case 'reflection': pageContent = ReflectionPage(); break;
            case 'progress': pageContent = ProgressPage(); break;
            case 'profile': pageContent = ProfilePage(); break;
            default: pageContent = LandingPage();
        }

        const modalHtml = selectedArticle ? `
            <div class="modal-overlay" id="articleModal">
                <div class="modal-content">
                    <button id="closeModalBtn" class="btn btn-small" style="border-color:#ddd; width: auto; margin-bottom: 20px;">← Voltar</button>
                    <div class="mb-4">
                        <span class="text-caption">${selectedArticle.type || 'ARTIGO'}</span>
                        <h2 class="section-title mt-1">${selectedArticle.title}</h2>
                        <div class="text-small mt-2">5 min leitura · NutriMente</div>
                    </div>
                    <div class="card-highlight" style="padding: 80px 20px; text-align: center; background: #f5f5f5; margin-bottom: 20px; border-radius: 20px;">
                        <span class="text-small">[imagem ilustrativa]</span>
                    </div>
                    <div class="flex flex-col gap-3 text-body">
                        <p>O caminho para uma relação saudável com a comida começa no autoconhecimento. Muitas vezes, comemos não por fome física, mas para preencher vazios emocionais.</p>
                        <p>Neste artigo, exploramos como a atenção plena transforma cada refeição em um ritual de presença e autocuidado.</p>
                        <div class="border-l-2 border-black pl-4 italic text-small">"A comida é o combustível, mas a consciência é o motor que nos guia."</div>
                    </div>
                    <button id="closeModalFooterBtn" class="btn mt-5">Concluir Leitura</button>
                </div>
            </div>
        ` : '';

        root.innerHTML = `
            <div class="screen-content">
                ${pageContent}
                ${showBottomNav ? `
                    <div class="bottom-nav">
                        <div class="nav-items">
                            <button class="nav-item ${currentPage === 'dashboard' ? 'active' : ''}" data-nav="dashboard">Início</button>
                            <button class="nav-item ${currentPage === 'meal-log' ? 'active' : ''}" data-nav="meal-log">Registrar</button>
                            <button class="nav-item ${currentPage === 'content' ? 'active' : ''}" data-nav="content">Biblioteca</button>
                            <button class="nav-item ${currentPage === 'progress' ? 'active' : ''}" data-nav="progress">Insights</button>
                            <button class="nav-item ${currentPage === 'profile' ? 'active' : ''}" data-nav="profile">Perfil</button>
                        </div>
                    </div>
                ` : ''}
            </div>
            ${modalHtml}
        `;

        attachEvents();
    }

    // ----- PAGE COMPONENTS WITH PERFECT SPACING -----
    function LandingPage() {
        return `
            <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-height: 70vh;">
                <div>
                    <div class="flex justify-between text-caption mb-6">
                        <span>VOL.01</span>
                        <span>OUTONO 2026</span>
                    </div>
                    <div class="mb-5">
                        <div class="hero-title">Nutri</div>
                        <div class="hero-title" style="margin-top: -4px;">Mente</div>
                    </div>
                    <div class="border-l-2 border-black pl-4 mb-4">
                        <p style="font-size: 1.125rem; font-weight: 450; line-height: 1.35;">Um diálogo <span class="italic">consciente</span><br>com seu corpo.</p>
                    </div>
                    <p class="text-small" style="color: #6b6b6b; max-width: 85%;">Abordagem focada na psicologia da nutrição. Sem dietas, só consciência alimentar.</p>
                </div>
                <div class="button-stack" style="margin-top: 40px;">
                    <button id="startAuthBtn" class="btn">Entrar no Studio →</button>
                    <div class="divider"></div>
                    <div class="flex justify-between text-caption" style="font-size: 0.6rem;">
                        <span>© NutriMente Studio</span>
                        <span>wireframe MVP</span>
                    </div>
                </div>
            </div>
        `;
    }

    function AuthPage() {
        return `
            <div>
                <div class="mb-6">
                    <h1 class="page-title">Olá.</h1>
                    <p class="text-small mt-2" style="color: #5a5a5a;">Vamos começar sua jornada consciente</p>
                </div>
                <div class="input-group">
                    <label>E-MAIL</label>
                    <input type="email" placeholder="seu@email.com" />
                </div>
                <div class="input-group">
                    <label>SENHA</label>
                    <input type="password" placeholder="••••••" />
                </div>
                <div class="button-stack">
                    <button id="authCreateBtn" class="btn">Criar conta</button>
                    <button id="authGoogleBtn" class="btn btn-secondary">Continuar com Google</button>
                </div>
            </div>
        `;
    }

    function DiagnosisPage() {
        const steps = [
            { title: "Qual seu principal objetivo?", options: ["Melhorar relação com a comida", "Reduzir compulsão alimentar", "Ganhar consciência alimentar", "Equilíbrio de peso"] },
            { title: "Quais seus principais desafios?", options: ["Ansiedade ao comer", "Compulsão por tédio", "Desejos noturnos", "Falta de rotina"] }
        ];
        const step = steps[diagnosisStep];
        const progress = ((diagnosisStep + 1) / steps.length) * 100;
        return `
            <div>
                <div class="progress-container">
                    <span class="text-caption">PASSO ${diagnosisStep+1}/${steps.length}</span>
                    <div class="progress-bar-bg"><div class="progress-fill" style="width: ${progress}%;"></div></div>
                </div>
                <h2 class="page-title mb-5">${step.title}</h2>
                <div class="grid-2">
                    ${step.options.map((opt, idx) => `
                        <button data-diagnosis-opt="${idx}" class="btn" style="justify-content: flex-start; text-align: left; padding: 14px;">${opt}</button>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function DashboardPage() {
        const meals = [
            { title: "Café da Manhã", time: "08:30", type: "Física" },
            { title: "Almoço", time: "12:45", type: "Física" },
            { title: "Lanche da tarde", time: "16:20", type: "Emocional" }
        ];
        return `
            <div>
                <div class="flex justify-between items-center mb-5">
                    <div>
                        <h1 class="page-title">Diário.</h1>
                        <p class="text-small mt-1">Espaço do Pedro</p>
                    </div>
                    <button id="profileAvatarBtn" class="avatar">👤</button>
                </div>
                <div class="card card-highlight mb-5">
                    <p class="italic text-body">"Respeite os sinais de saciedade. Ele é seu guia mais autêntico."</p>
                    <div class="text-caption mt-3">— Insight do dia</div>
                </div>
                <div class="card mb-5">
                    <span class="text-caption">🍃 DICA NUTRICIONAL</span>
                    <p class="text-body mt-2">Inclua proteína em todas as refeições para estabilidade do humor e energia.</p>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-caption">ENTRADAS RECENTES</span>
                    </div>
                    ${meals.map(meal => `
                        <div class="list-item">
                            <div><div class="font-medium">${meal.title}</div><div class="text-small mt-1">${meal.time} · ${meal.type}</div></div>
                            <span class="text-small">→</span>
                        </div>
                    `).join('')}
                </div>
                <button id="quickCheckinBtn" class="btn mt-5" style="border-style: dashed; border-color: #aaa;">+ Registrar novo momento</button>
            </div>
        `;
    }

    function CheckinPage() {
        return `
            <div>
                <div class="flex justify-between items-center mb-5">
                    <button id="backFromCheckin" class="btn btn-small" style="border-color:#ddd;">← Voltar</button>
                    <span class="text-caption">Passo 01</span>
                </div>
                <h2 class="page-title mb-5">Sintonizar.</h2>
                <div class="mb-5">
                    <label>ESTADO ATUAL</label>
                    <div class="grid-2 mt-2">
                        <button class="btn" style="padding: 14px;">😌 Calmo</button>
                        <button class="btn" style="padding: 14px;">😐 Neutro</button>
                        <button class="btn" style="padding: 14px;">😟 Tenso</button>
                        <button class="btn" style="padding: 14px;">❤️ Ansioso</button>
                    </div>
                </div>
                <div class="mb-5">
                    <label>ORIGEM DA FOME</label>
                    <div class="grid-2 mt-2">
                        <button class="btn">Física</button>
                        <button class="btn">Emocional</button>
                    </div>
                </div>
                <button id="submitCheckinBtn" class="btn mt-4">CONTINUAR →</button>
            </div>
        `;
    }

    function MealLogPage() {
        return `
            <div>
                <div class="flex justify-between items-center mb-5">
                    <button id="backFromMeal" class="btn btn-small" style="border-color:#ddd;">← Voltar</button>
                    <span class="text-caption">Registro</span>
                </div>
                <h2 class="page-title mb-5">Registrar.</h2>
                <div class="card" style="border-style: dashed; padding: 32px; text-align: center; margin-bottom: 20px;">
                    <button id="mockPhotoBtn" class="btn btn-small">📷 Adicionar foto</button>
                </div>
                <div class="input-group">
                    <label>COMO VOCÊ SE SENTE?</label>
                    <textarea placeholder="Descreva sua refeição e emoções..."></textarea>
                </div>
                <div class="button-stack">
                    <button id="saveMealBtn" class="btn">Salvar entrada</button>
                    <button id="cancelMealBtn" class="btn btn-secondary">Cancelar</button>
                </div>
            </div>
        `;
    }

    function ContentPage() {
        const items = [
            { title: "Comer Consciente", type: "Artigo" },
            { title: "Física vs Emocional", type: "Guia" },
            { title: "Lidando com a Culpa", type: "Reflexão" },
            { title: "Sinais de Saciedade", type: "Prática" }
        ];
        return `
            <div>
                <h1 class="page-title mb-5">Biblioteca.</h1>
                ${items.map((item, idx) => `
                    <div data-article='${JSON.stringify({title: item.title, type: item.type})}' class="article-trigger list-item cursor-pointer">
                        <div><div class="font-medium">${item.title}</div><div class="text-small mt-1">${item.type} · 3 min leitura</div></div>
                        <span class="text-small">→</span>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function ReflectionPage() {
        return `
            <div>
                <div class="flex justify-between items-center mb-5">
                    <button id="backReflectionBtn" class="btn btn-small" style="border-color:#ddd;">← Voltar</button>
                    <span class="text-caption">Reflexão</span>
                </div>
                <h2 class="page-title mb-5">Refletir.</h2>
                <div class="input-group">
                    <label>GRATIDÃO DIÁRIA</label>
                    <textarea placeholder="O que correu bem hoje?"></textarea>
                </div>
                <div class="mb-5">
                    <label>GATILHOS EMOCIONAIS</label>
                    <div class="grid-3 mt-2">
                        <button class="btn btn-small">Nenhum</button>
                        <button class="btn btn-small">Estresse</button>
                        <button class="btn btn-small">Tédio</button>
                    </div>
                </div>
                <button id="finishReflectionBtn" class="btn mt-4">FINALIZAR DIA →</button>
            </div>
        `;
    }

    function ProgressPage() {
        const chartData = [40, 70, 45, 90, 65, 80, 55];
        return `
            <div>
                <h1 class="page-title mb-5">Insights.</h1>
                <div class="card flex justify-between items-center mb-4">
                    <div><div class="text-caption">SCORE DE ATENÇÃO</div><div class="hero-title" style="font-size: 2.5rem;">88%</div></div>
                    <div class="avatar" style="width: 48px; height: 48px;">⚡</div>
                </div>
                <div class="grid-2 mb-4">
                    <div class="card"><div class="section-title">24</div><div class="text-small mt-1">Momentos</div></div>
                    <div class="card"><div class="section-title">72%</div><div class="text-small mt-1">Fome Física</div></div>
                    <div class="card"><div class="section-title">18</div><div class="text-small mt-1">Reflexões</div></div>
                    <div class="card"><div class="section-title">+5%</div><div class="text-small mt-1">Consistência</div></div>
                </div>
                <div class="card mb-4">
                    <div class="text-caption mb-4">FREQUÊNCIA EMOCIONAL (7 dias)</div>
                    <div class="flex gap-2 items-end" style="height: 100px;">
                        ${chartData.map(val => `<div style="height: ${val}%; width: 100%; max-width: 32px; background: #1a1a1a; min-height: 4px;"></div>`).join('')}
                    </div>
                    <div class="flex justify-between mt-3 text-small">
                        <span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span><span>Dom</span>
                    </div>
                </div>
                <button id="logoutFromProgress" class="btn btn-secondary mt-2">Sair do Studio</button>
            </div>
        `;
    }

    function ProfilePage() {
        return `
            <div>
                <div class="text-center mb-6">
                    <div class="avatar avatar-large mb-3">👤</div>
                    <h2 class="section-title">Pedro</h2>
                    <div class="text-small mt-1">Membro desde Outono 2026</div>
                </div>
                <div class="mb-5">
                    <label>PREFERÊNCIA VISUAL</label>
                    <div class="button-group-horizontal mt-2">
                        <button class="btn btn-small">Clássico</button>
                        <button class="btn btn-small">Orgânico</button>
                        <button class="btn btn-small">Suave</button>
                    </div>
                </div>
                <div>
                    <div class="list-item"><span>Configurações da conta</span><span>→</span></div>
                    <div class="list-item"><span>Notificações</span><span>→</span></div>
                    <div class="list-item"><span>Privacidade</span><span>→</span></div>
                </div>
                <button id="profileLogoutBtn" class="btn btn-outline-danger mt-5">Sair do Studio</button>
            </div>
        `;
    }

    // ----- EVENT HANDLERS -----
    function attachEvents() {
        // Bottom navigation
        document.querySelectorAll('[data-nav]').forEach(btn => {
            btn.addEventListener('click', () => {
                const page = btn.getAttribute('data-nav');
                if (page === 'dashboard') { currentPage = 'dashboard'; selectedArticle = null; render(); }
                if (page === 'meal-log') { currentPage = 'meal-log'; render(); }
                if (page === 'content') { currentPage = 'content'; selectedArticle = null; render(); }
                if (page === 'progress') { currentPage = 'progress'; render(); }
                if (page === 'profile') { currentPage = 'profile'; render(); }
            });
        });

        // Auth flow
        const startBtn = document.getElementById('startAuthBtn');
        if (startBtn) startBtn.onclick = () => { currentPage = 'auth'; render(); };
        const authCreate = document.getElementById('authCreateBtn');
        if (authCreate) authCreate.onclick = () => { currentPage = 'diagnosis'; diagnosisStep = 0; render(); };
        const authGoogle = document.getElementById('authGoogleBtn');
        if (authGoogle) authGoogle.onclick = () => { currentPage = 'diagnosis'; diagnosisStep = 0; render(); };

        // Diagnosis options
        document.querySelectorAll('[data-diagnosis-opt]').forEach(opt => {
            opt.addEventListener('click', () => {
                if (diagnosisStep === 0) { diagnosisStep = 1; render(); }
                else if (diagnosisStep === 1) { currentPage = 'dashboard'; render(); }
            });
        });

        // Dashboard actions
        const quickCheckin = document.getElementById('quickCheckinBtn');
        if (quickCheckin) quickCheckin.onclick = () => { currentPage = 'checkin'; render(); };
        const profileAvatar = document.getElementById('profileAvatarBtn');
        if (profileAvatar) profileAvatar.onclick = () => { currentPage = 'profile'; render(); };
        
        // Checkin
        const backCheckin = document.getElementById('backFromCheckin');
        if (backCheckin) backCheckin.onclick = () => { currentPage = 'dashboard'; render(); };
        const submitCheckin = document.getElementById('submitCheckinBtn');
        if (submitCheckin) submitCheckin.onclick = () => { currentPage = 'dashboard'; render(); };
        
        // Meal log
        const backMeal = document.getElementById('backFromMeal');
        if (backMeal) backMeal.onclick = () => { currentPage = 'dashboard'; render(); };
        const saveMeal = document.getElementById('saveMealBtn');
        if (saveMeal) saveMeal.onclick = () => { currentPage = 'dashboard'; render(); };
        const cancelMeal = document.getElementById('cancelMealBtn');
        if (cancelMeal) cancelMeal.onclick = () => { currentPage = 'dashboard'; render(); };
        const mockPhoto = document.getElementById('mockPhotoBtn');
        if (mockPhoto) mockPhoto.onclick = () => { alert('[wireframe] câmera simulada'); };
        
        // Reflection
        const backRef = document.getElementById('backReflectionBtn');
        if (backRef) backRef.onclick = () => { currentPage = 'dashboard'; render(); };
        const finishRef = document.getElementById('finishReflectionBtn');
        if (finishRef) finishRef.onclick = () => { currentPage = 'progress'; render(); };
        
        // Content articles
        document.querySelectorAll('.article-trigger').forEach(el => {
            el.addEventListener('click', () => {
                const data = el.getAttribute('data-article');
                if (data) { selectedArticle = JSON.parse(data); render(); }
            });
        });
        
        // Modal close
        const closeModal = () => { selectedArticle = null; render(); };
        const closeBtn = document.getElementById('closeModalBtn');
        if (closeBtn) closeBtn.onclick = closeModal;
        const closeFooter = document.getElementById('closeModalFooterBtn');
        if (closeFooter) closeFooter.onclick = closeModal;
        
        // Logout
        const logoutProgress = document.getElementById('logoutFromProgress');
        if (logoutProgress) logoutProgress.onclick = () => { currentPage = 'landing'; selectedArticle = null; render(); };
        const profileLogout = document.getElementById('profileLogoutBtn');
        if (profileLogout) profileLogout.onclick = () => { currentPage = 'landing'; render(); };
    }

    render();
</script>
</body>
</html>
